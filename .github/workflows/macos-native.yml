name: Build Native macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'native/macos/**'
      - 'scripts/build-macos-native.sh'
      - 'scripts/install-macos-native.sh'
      - '.github/workflows/macos-native.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'native/macos/**'
      - 'scripts/build-macos-native.sh'
      - 'scripts/install-macos-native.sh'
      - '.github/workflows/macos-native.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-macos:
    name: Build & Package Native macOS App (SwiftUI/AppKit)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            native/macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftPM unit tests
        working-directory: native/macos
        run: swift test

      - name: Build, ad-hoc sign, and package native macOS app (.app, .dmg, .zip)
        run: ./scripts/build-macos-native.sh

      - name: Upload Native macOS DMG Artifact (Download on the fly)
        uses: actions/upload-artifact@v4
        with:
          name: KobeanSQL-macOS-native-dmg
          path: dist/native-macos/KobeanSQL-*-macOS-native-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Native macOS ZIP Artifact (Download on the fly)
        uses: actions/upload-artifact@v4
        with:
          name: KobeanSQL-macOS-native-zip
          path: dist/native-macos/KobeanSQL-*-macOS-native-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish installation summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🍎 KobeanSQL Native macOS App (SwiftUI + AppKit)

          Download the **ad-hoc signed** native macOS build directly from the **Artifacts** section of this workflow run:
          - **`KobeanSQL-macOS-native-dmg`** — Disk image containing `KobeanSQL.app` + one-click `Install KobeanSQL (No Apple Dev Account).command`
          - **`KobeanSQL-macOS-native-zip`** — Compressed `KobeanSQL.app` bundle

          ### Installing on MacBook Pro (No Apple Developer Account Required)
          1. **Option A (DMG Installer):** Open the `.dmg` and double-click **`Install KobeanSQL (No Apple Dev Account).command`** (or drag `KobeanSQL.app` to `/Applications`).
          2. **Option B (Terminal one-liner after extracting to `/Applications`):**
             ```bash
             xattr -cr /Applications/KobeanSQL.app && open /Applications/KobeanSQL.app
             ```
          EOF
