name: Build Native macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'native/macos/**'
      - 'scripts/build-macos-native.sh'
      - 'scripts/install-macos-native.sh'
      - '.github/workflows/macos-native.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'native/macos/**'
      - 'scripts/build-macos-native.sh'
      - 'scripts/install-macos-native.sh'
      - '.github/workflows/macos-native.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish/attach native macOS artifacts to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "GitHub Release tag (e.g. v1.35.0). Defaults to v<package.json version>."
        required: false
        type: string
      prerelease:
        description: "Mark newly created release as pre-release"
        required: false
        default: false
        type: boolean
      universal:
        description: "Build universal binary (arm64 + x86_64)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-native-macos:
    name: Build & Package Native macOS App (SwiftUI/AppKit)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          raw_tag="${{ inputs.release_tag }}"
          if [ -n "$raw_tag" ]; then
            tag="$raw_tag"
            version="${raw_tag#v}"
          else
            tag="v${pkg_version}"
            version="${pkg_version}"
          fi
          arch_mode="native"
          if [ "${{ inputs.universal }}" = "true" ]; then
            arch_mode="universal"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch_mode=$arch_mode" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            native/macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftPM unit tests
        working-directory: native/macos
        run: |
          set -euo pipefail
          CXX_FLAGS=()
          if ! echo '#include <memory>' | clang++ -x c++ -fsyntax-only - >/dev/null 2>&1; then
            SDK_PATH="$(xcrun --show-sdk-path)"
            if [ -d "$SDK_PATH/usr/include/c++/v1" ]; then
              CXX_FLAGS=(-Xcxx -nostdinc++ -Xcxx -isystem -Xcxx "$SDK_PATH/usr/include/c++/v1")
            fi
          fi
          swift test ${CXX_FLAGS[@]+"${CXX_FLAGS[@]}"}

      - name: Build, ad-hoc sign, and package native macOS app (.app, .dmg, .zip, SHA256SUMS)
        run: |
          ./scripts/build-macos-native.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --arch "${{ steps.meta.outputs.arch_mode }}"

      - name: Upload Native macOS DMG Artifact (Download on the fly)
        uses: actions/upload-artifact@v4
        with:
          name: KobeanSQL-macOS-native-dmg
          path: dist/native-macos/KobeanSQL-*-macOS-native-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Native macOS ZIP Artifact (Download on the fly)
        uses: actions/upload-artifact@v4
        with:
          name: KobeanSQL-macOS-native-zip
          path: dist/native-macos/KobeanSQL-*-macOS-native-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Native macOS SHA256SUMS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KobeanSQL-macOS-native-checksums
          path: dist/native-macos/KobeanSQL-*-macOS-native-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish native macOS artifacts to GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXTRA_ARGS=(--generate-notes)
            if [ "${{ inputs.prerelease }}" = "true" ] || [[ "$TAG" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KobeanSQL $TAG" \
              "${EXTRA_ARGS[@]}"
          fi
          gh release upload "$TAG" \
            dist/native-macos/KobeanSQL-*-macOS-native-*.dmg \
            dist/native-macos/KobeanSQL-*-macOS-native-*.zip \
            dist/native-macos/KobeanSQL-*-macOS-native-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish installation summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🍎 KobeanSQL Native macOS App (SwiftUI + AppKit)

          Download the **ad-hoc signed** native macOS build directly from the **Artifacts** section of this workflow run (or from **GitHub Releases** when published):
          - **`KobeanSQL-macOS-native-dmg`** — Disk image containing `KobeanSQL.app` + one-click `Install KobeanSQL (No Apple Dev Account).command`
          - **`KobeanSQL-macOS-native-zip`** — Compressed `KobeanSQL.app` bundle
          - **`KobeanSQL-macOS-native-checksums`** — `SHA256SUMS.txt` cryptographic digests for auto-update verification

          ### Installing on macOS (No Apple Developer Account Required)
          1. **Option A (DMG Installer):** Open the `.dmg` and double-click **`Install KobeanSQL (No Apple Dev Account).command`** (or drag `KobeanSQL.app` to `/Applications`).
          2. **Option B (Terminal one-liner after extracting to `/Applications`):**
             ```bash
             xattr -cr /Applications/KobeanSQL.app && open /Applications/KobeanSQL.app
             ```
          EOF
